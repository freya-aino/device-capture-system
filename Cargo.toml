[package]
name = "device-capture-system"
version = "0.1.0"
edition = "2024"

[lib]
name = "device_capture_system"
path = "src/lib.rs"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.32", features = ["derive"] }
cpal = "0.15.3"
portpicker = "0.1.1"
serde = "1.0.219"
tokio = "1.44.2"
zmq = "0.10.0"

[dependencies.nokhwa]
version = "0.10.7"
features = ["input-native", "output-wgpu"]
