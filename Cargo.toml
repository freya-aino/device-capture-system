[package]
name = "device-capture-system"
version = "0.1.0"
edition = "2024"

[lib]
name = "device_capture_system"
path = "src/lib.rs"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"


[dependencies]
bincode = "2.0.1"
anyhow = "1.0.97"
zmq = "0.10.0"
flume = "0.11.1"
http = { version = "1.3.1", optional = true}
tiny_http = { version = "0.12.0", optional = true }
portpicker = { version = "0.1.1", optional = true }
v4l = { version = "0.14.0", optional = true }
cpal = { version = "0.15.3", optional = true }
glob = { version = "0.3.2", optional = true }

[features]
device = [
    "v4l",
    "cpal",
    "glob",
]
broker = [
    "tiny_http"
]
client = [
    "http"
]

