[package]
name = "device-capture-system"
version = "0.1.0"
edition = "2024"

[lib]
name = "device_capture"
path = "src/lib.rs"

[[bin]]
name = "device-capture-system"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.32", features = ["derive"] }
cpal = "0.15.3"
rand = "0.9.0"
serde = "1.0.219"
serde_json = "1.0.140"
tokio = "1.44.2"
webrtc = "0.12.0"

[dependencies.nokhwa]
version = "0.10.7"
features = ["input-native", "output-wgpu"]
